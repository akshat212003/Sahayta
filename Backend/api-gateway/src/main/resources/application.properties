spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.server.webmvc.discovery.locator.enabled=true
spring.cloud.gateway.server.webmvc.discovery.locator.lower-case-service-id=true

# ==================== CORS ====================
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].maxAge=3600
# ==============================================

# Donation Service
spring.cloud.gateway.server.webmvc.routes[0].id=donation-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://donation-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/donations/**

# Auth Service
spring.cloud.gateway.server.webmvc.routes[1].id=auth-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/auth/**

# Request Service
spring.cloud.gateway.server.webmvc.routes[2].id=request-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://request-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/requests/**

# Admin Service
spring.cloud.gateway.server.webmvc.routes[3].id=admin-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://admin-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/admin/**

# Notifications (via auth-service)
spring.cloud.gateway.server.webmvc.routes[4].id=notification-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/notifications/**